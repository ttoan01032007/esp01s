<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bảng Điều Khiển & Hẹn Giờ ESP-01S</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --on-color: #22c55e;
      --off-color: #ef4444;
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background-color: var(--card);
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      margin-bottom: 12px;
    }
    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .status-panel {
      margin-bottom: 20px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .status-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .status-value {
      font-size: 20px;
      font-weight: 800;
    }
    .status-on {
      color: var(--on-color);
      text-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
    }
    .status-off {
      color: var(--off-color);
      text-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
    }
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 16px 0;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:active { transform: scale(0.97); }
    .btn-on {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.3);
    }
    .btn-off {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3);
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin: 18px 0 12px;
      text-align: left;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }
    .schedule-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .schedule-label {
      font-size: 14px;
      font-weight: 600;
      width: 75px;
      text-align: left;
    }
    input[type="time"] {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      padding: 8px 6px;
      font-size: 15px;
      outline: none;
      flex-grow: 1;
    }
    .btn-timer {
      background: #2563eb;
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 10px;
    }
    .btn-cancel {
      background: #475569;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 10px;
    }
    .footer-log {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <span class="dot"></span> Blynk API • ESP-01S
    </div>
    <h1>Điều Khiển & Hẹn Giờ</h1>

    <div class="status-panel">
      <div class="status-label">Trạng thái thiết bị</div>
      <div id="statusText" class="status-value status-off">SẴN SÀNG</div>
    </div>

    <!-- ĐÃ ĐẢO TRỰC TIẾP TRÊN WEB:
         Nút BẬT (màu xanh) sẽ gửi giá trị làm relay đóng thực tế (V0 = 0)
         Nút TẮT (màu đỏ) sẽ gửi giá trị làm relay ngắt thực tế (V0 = 1) -->
    <div class="buttons-grid">
      <button class="btn-on" onclick="sendRelay(0)">BẬT</button>
      <button class="btn-off" onclick="sendRelay(1)">TẮT</button>
    </div>

    <div class="section-title">⏱ HẸN GIỜ TỰ ĐỘNG (LƯU VÀO ESP)</div>

    <!-- Hẹn giờ BẬT: gửi vào slot giờ bật trên ESP nhưng đảo chân nếu ESP nhận V3/V4, 
         ở đây ESP đang so khớp:
         onHour/onMin (V1, V2) -> setDevice(1) [đang làm relay bị TẮT]
         offHour/offMin (V3, V4) -> setDevice(0) [đang làm relay được BẬT]
         Vì vậy:
         - Ô Hẹn BẬT trên web sẽ gửi vào V3, V4 (để khi tới giờ đó ESP gọi setDevice(0) -> RƠ-LE ĐƯỢC BẬT)
         - Ô Hẹn TẮT trên web sẽ gửi vào V1, V2 (để khi tới giờ đó ESP gọi setDevice(1) -> RƠ-LE ĐƯỢC TẮT)
    -->
    <div class="schedule-row">
      <span class="schedule-label" style="color: var(--on-color);">Hẹn BẬT:</span>
      <input type="time" id="timeOn">
      <button class="btn-timer" onclick="saveTimer('ON')">Lưu</button>
      <button class="btn-cancel" onclick="cancelTimer('ON')">Hủy</button>
    </div>

    <div class="schedule-row">
      <span class="schedule-label" style="color: var(--off-color);">Hẹn TẮT:</span>
      <input type="time" id="timeOff">
      <button class="btn-timer" onclick="saveTimer('OFF')">Lưu</button>
      <button class="btn-cancel" onclick="cancelTimer('OFF')">Hủy</button>
    </div>

    <div class="footer-log" id="logMsg">Chạm nút để thao tác</div>
  </div>

  <script>
    const TOKEN = "YQ2mDr3RdvQTWXD-jaNE1wA4yqYW4FnT";
    const BASE_URL = "https://sgp1.blynk.cloud/external/api";

    const statusEl = document.getElementById("statusText");
    const logEl = document.getElementById("logMsg");

    function callBlynk(urlParams, msg, onDone) {
      logEl.textContent = msg;
      const img = new Image();
      img.src = `${BASE_URL}/update?token=${TOKEN}&${urlParams}&t=${Date.now()}`;
      img.onload = img.onerror = function() {
        if (onDone) onDone();
      };
    }

    // val = 0: Nút BẬT (khiến relay đóng)
    // val = 1: Nút TẮT (khiến relay ngắt)
    function sendRelay(val) {
      const isTurnOn = (val === 0);
      callBlynk(`V0=${val}`, isTurnOn ? "Đang gửi lệnh BẬT..." : "Đang gửi lệnh TẮT...", function() {
        if (isTurnOn) {
          statusEl.textContent = "ĐANG BẬT";
          statusEl.className = "status-value status-on";
          logEl.textContent = "Đã BẬT thành công!";
        } else {
          statusEl.textContent = "ĐANG TẮT";
          statusEl.className = "status-value status-off";
          logEl.textContent = "Đã TẮT thành công!";
        }
      });
    }

    // Đảo ngược chân hẹn giờ trên Web để khớp với chip hiện tại:
    // Cài Hẹn BẬT -> gửi vào V3 (giờ) & V4 (phút) để kích lệnh setDevice(0)
    // Cài Hẹn TẮT -> gửi vào V1 (giờ) & V2 (phút) để kích lệnh setDevice(1)
    function saveTimer(type) {
      if (type === 'ON') {
        const val = document.getElementById('timeOn').value;
        if (!val) { alert("Vui lòng chọn giờ bật!"); return; }
        const [h, m] = val.split(':');
        logEl.textContent = `Đang lưu hẹn BẬT lúc ${val}...`;

        callBlynk(`V3=${parseInt(h)}`, "Đang gửi cấu hình...", function() {
          callBlynk(`V4=${parseInt(m)}`, `Đã hẹn giờ BẬT lúc: ${val}`, function() {
            logEl.textContent = `Đã kích hoạt hẹn BẬT lúc ${val}`;
          });
        });
      } else {
        const val = document.getElementById('timeOff').value;
        if (!val) { alert("Vui lòng chọn giờ tắt!"); return; }
        const [h, m] = val.split(':');
        logEl.textContent = `Đang lưu hẹn TẮT lúc ${val}...`;

        callBlynk(`V1=${parseInt(h)}`, "Đang gửi cấu hình...", function() {
          callBlynk(`V2=${parseInt(m)}`, `Đã hẹn giờ TẮT lúc: ${val}`, function() {
            logEl.textContent = `Đã kích hoạt hẹn TẮT lúc ${val}`;
          });
        });
      }
    }

    function cancelTimer(type) {
      if (type === 'ON') {
        document.getElementById('timeOn').value = '';
        callBlynk(`V3=-1`, "Đang hủy...", function() {
          callBlynk(`V4=-1`, "Đã hủy hẹn giờ BẬT!", function() {
            logEl.textContent = "Đã hủy hẹn giờ BẬT!";
          });
        });
      } else {
        document.getElementById('timeOff').value = '';
        callBlynk(`V1=-1`, "Đang hủy...", function() {
          callBlynk(`V2=-1`, "Đã hủy hẹn giờ TẮT!", function() {
            logEl.textContent = "Đã hủy hẹn giờ TẮT!";
          });
        });
      }
    }
  </script>
</body>
</html>
